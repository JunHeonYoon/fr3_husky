controller_names:
  - single_fr3_arm_controller
  - right_franka_gripper

single_fr3_arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - right_fr3_joint1
    - right_fr3_joint2
    - right_fr3_joint3
    - right_fr3_joint4
    - right_fr3_joint5
    - right_fr3_joint6
    - right_fr3_joint7

right_franka_gripper:
    action_ns: gripper_action
    type: GripperCommand
    default: true
    joints:
      - right_fr3_finger_joint1
      - right_fr3_finger_joint2