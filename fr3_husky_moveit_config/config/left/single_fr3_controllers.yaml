controller_names:
  - single_fr3_arm_controller
  - left_franka_gripper

single_fr3_arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - left_fr3_joint1
    - left_fr3_joint2
    - left_fr3_joint3
    - left_fr3_joint4
    - left_fr3_joint5
    - left_fr3_joint6
    - left_fr3_joint7

left_franka_gripper:
    action_ns: gripper_action
    type: GripperCommand
    default: true
    joints:
      - left_fr3_finger_joint1
      - left_fr3_finger_joint2